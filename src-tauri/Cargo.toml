[package]
name = "clipforge"
version = "0.1.0"
edition = "2021"
description = "ClipForge - local-first video clipping for short-form platforms"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "clipforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
clipforge-core = { path = "../crates/clipforge-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
