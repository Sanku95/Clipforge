[package]
name = "clipforge-core"
version = "0.1.0"
edition = "2021"
description = "ClipForge media core: probing, cropping, FFmpeg export and verification (no GUI dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
