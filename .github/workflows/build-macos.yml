name: Build macOS app

on:
  push:
    branches: [main, feature/desktop-app]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub pre-release with this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            arch: aarch64
            triple: aarch64-apple-darwin
            runner: macos-latest
          - name: Intel
            arch: x86_64
            triple: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      CLIPFORGE_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-${{ matrix.triple }}
      CLIPFORGE_FFPROBE: ${{ github.workspace }}/src-tauri/binaries/ffprobe-${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install nasm pkgconf

      - name: Restore FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/resources/licenses
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      - name: Build FFmpeg (GPL, libx264) from official source
        env:
          CI_EXTRA_LOG: ${{ github.workspace }}/.cache/ffbuild/ffmpeg/ffbuild/config.log
        run: bash scripts/ci-run.sh "FFmpeg build" bash scripts/build-ffmpeg-macos.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: |
          bash scripts/ci-run.sh "Typecheck" npm run typecheck
          bash scripts/ci-run.sh "Frontend tests" npm test

      - name: Core tests against the bundled FFmpeg
        run: bash scripts/ci-run.sh "Core tests" cargo test -p clipforge-core

      - name: Build app and DMG
        run: bash scripts/ci-run.sh "Tauri build" npx tauri build

      - name: Verify the DMG and the installed app
        id: verify
        run: bash scripts/ci-run.sh "DMG verification" bash scripts/ci-verify-macos.sh ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }} ${{ matrix.arch }}

      - name: Launch smoke test (GUI starts and stays running)
        id: launch
        continue-on-error: true
        run: |
          set -uo pipefail
          open -n "${{ steps.verify.outputs.app }}"
          sleep 15
          if pgrep -x "${{ steps.verify.outputs.exe }}" >/dev/null; then
            echo "App is running after 15s."
            pkill -x "${{ steps.verify.outputs.exe }}" || true
          else
            echo "App is NOT running after 15s."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }} (${{ matrix.triple }})"
            echo "- Build + DMG + installed-app self-test: \`${{ steps.verify.outcome }}\`"
            echo "- GUI launch smoke test: \`${{ steps.launch.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-${{ matrix.arch }}-dmg
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ClipForge-*-dmg
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          cat > notes.md <<'EOF'
          **Which file?** Apple menu → About This Mac. "Chip: Apple M…" → `ClipForge_aarch64.dmg`. "Processor: Intel…" → `ClipForge_x86_64.dmg`.

          **Install:** open the DMG and drag ClipForge to Applications.

          **First launch:** this build is *not* signed with an Apple Developer ID or notarized, so macOS will block it the first time.
          Open System Settings → Privacy & Security, scroll to the message about ClipForge, and click **Open Anyway**.
          (On macOS 14 and earlier you can also right-click the app and choose Open.)

          Verify your download against the `.sha256` file. FFmpeg/x264 source information is inside the app (`Contents/Resources/licenses/BUILD-INFO.txt`).
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ClipForge $TAG" \
            --notes-file notes.md
